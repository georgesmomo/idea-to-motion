<template>
  <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
    <div class="mo-scene" id="s6-scene">
      <div class="mo-gl-host" id="s6-gl"></div>
      <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 34%, rgba(61,225,255,.22), transparent 58%)"></div>
      <div class="mo-stage" id="s6-stage">
        <div class="mo-center" style="top:300px"><div class="mo-kicker" id="s6-k">5 / 5 · eau</div></div>
        <div class="mo-center" style="top:1000px;max-width:700px;margin:0 auto">
          <div class="mo-mega mo-accent-2" id="s6-n" style="line-height:1">73 %</div>
          <div class="mo-title" id="s6-t" style="margin-top:12px">d'eau</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const D = 4.4;
      const tl = gsap.timeline({ paused: true });
      MO.enter(tl, "#s6-scene", 0, "deck");
      const st = MO3D.stage(tl, "#s6-gl", { D, cam: [0, 0, 10], look: [0, 0, 0], bg: "#07080F", bloom: 0.3, bloomThreshold: 0.98, rim: "#3DE1FF", envIntensity: 0.6, exposure: 0.9 });
      const bubbles = MO3D.particles(st, "field", { count: 700, radius: 5, colors: ["#3DE1FF", "#ffffff"], size: 6, seed: 33 });
      MO3D.move(tl, bubbles, 0, { from: { y: -3 }, to: { y: 3 }, dur: D, ease: "none" });
      const drop = new st.T.Group(); st.root.add(drop);
      MO3D.svg(st, "emoji-droplet", { size: 1.4, depth: 0.25, parent: drop });
      drop.position.set(0, 1.5, 0);
      MO3D.hover(st, drop, { amp: 0.1, rot: 5, period: 2.4 });
      MO3D.move(tl, drop, 0.15, { from: { y: 5, s: 0.6 }, to: { y: 1.5, s: 1 }, dur: 1.0, ease: "bounce.out" });
      // A glass sphere refracting the drop: water in a bubble.
      const glass = MO3D.shape(st, "sphere", { size: 1.2, mat: "glass" });
      glass.position.set(0, 1.5, 0.2);
      MO3D.move(tl, glass, 0.6, { from: { s: 0.001 }, to: { s: 1 }, dur: 0.8, ease: "back.out(1.5)" });
      const tn = MO.atWord("s6", "73", { fallback: 1.2 });
      MO.reveal(tl, "#s6-k", 0.2, { kind: "rise" });
      MO.reveal(tl, "#s6-n", Math.max(0.3, tn - 0.4), { kind: "stamp" });
      MO.count(tl, "#s6-n", 0, 73, Math.max(0.3, tn - 0.4), { dur: 1.1, suffix: " %" });
      MO.reveal(tl, "#s6-t", MO.atWord("s6", "d'eau", { fallback: 2.0 }), { kind: "rise" });
      MO.exit(tl, "#s6-scene", D, "blur", { overlap: true });
      window.__timelines["s6"] = tl;
    })();
  </script>
</template>
