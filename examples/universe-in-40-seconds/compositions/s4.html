<template>
  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080">
    <div class="mo-scene" id="s4-scene">
      <div class="mo-gl-host" id="s4-gl"></div>
      <div class="mo-stage" id="s4-stage">
        <div class="mo-safe" style="top:120px">
          <div class="mo-kicker" id="s4-k">8 planets · 1 star</div>
          <div class="mo-title" id="s4-t" style="margin-top:18px;font-size:96px;line-height:1.05">Our whole<br>solar system</div>
        </div>
        <div class="mo-safe" style="top:760px;text-align:right">
          <div class="mo-title mo-accent" id="s4-s" style="font-size:110px">is a speck.</div>
        </div>
      </div>
      <div class="mo-grain"></div>
    </div>
  </div>
  <script>
    (function () {
      const D = 5;
      const tl = gsap.timeline({ paused: true });
      MO.enter(tl, "#s4-scene", 0, "back");
      const st = MO3D.stage(tl, "#s4-gl", { D, cam: [3, 7.5, 15], look: [1.5, 0, 0], fov: 38, bg: "--bg", bloom: 0.8, bloomThreshold: 0.7 });
      const T = st.T;
      MO3D.particles(st, "stars", { count: 2600, seed: 12 });
      const sys = new T.Group(); st.root.add(sys);
      sys.rotation.z = -0.12;
      const sun = MO3D.planet(st, "sun", { size: 0.62, seed: 3, res: 256, parent: sys });
      const P = [
        { r: 1.5, s: 0.07, k: "rock", c: "#9C8F86", w: 1.6 }, { r: 2.1, s: 0.12, k: "gas", c: "#E8CFA0", c2: "#C9A06A", w: 1.2 },
        { r: 2.8, s: 0.13, k: "earth", w: 1.0 }, { r: 3.5, s: 0.09, k: "mars", w: 0.8 },
        { r: 5.2, s: 0.38, k: "gas", c: "#D9B38C", c2: "#9C5B3A", w: 0.45 }, { r: 6.9, s: 0.32, k: "gas", c: "#EAD7A4", c2: "#B8955C", w: 0.33, ring: true },
        { r: 8.5, s: 0.22, k: "ice", c: "#A8E0EC", c2: "#6FB6D0", w: 0.24 }, { r: 9.9, s: 0.21, k: "ice", c: "#5C86F0", c2: "#2E4FB0", w: 0.19 },
      ];
      const planets = P.map((q, i) => {
        const pl = MO3D.planet(st, q.k, { size: q.s, seed: 20 + i, res: 256, color: q.c, color2: q.c2, clouds: false, glow: false, parent: sys });
        if (q.ring) { const rg = new T.Mesh(new T.RingGeometry(q.s * 1.4, q.s * 2.3, 96), new T.MeshBasicMaterial({ color: 0xd9c49a, side: T.DoubleSide, transparent: true, opacity: 0.7 })); rg.rotation.x = Math.PI / 2.4; pl.add(rg); }
        const pts = []; for (let k = 0; k <= 256; k++) { const a = (k / 256) * Math.PI * 2; pts.push(new T.Vector3(Math.cos(a) * q.r, 0, Math.sin(a) * q.r)); }
        sys.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16 })));
        return { pl, q, a0: i * 2.1 };
      });
      st.frame((t) => planets.forEach(({ pl, q, a0 }) => { const a = a0 + t * q.w * 0.35; pl.position.set(Math.cos(a) * q.r, 0, Math.sin(a) * q.r); }));
      // Pull back until the whole system is a single point of light in the centre.
      MO3D.cam(tl, st, 1.6, { pos: [0, 140, 260], look: [0, 0, 0], dur: D - 1.6, ease: "power3.in" });
      MO.reveal(tl, ["#s4-k", "#s4-t"], 0.35, { kind: "rise", stagger: 0.1 });
      MO.reveal(tl, "#s4-s", MO.atWord("s4", "speck", { fallback: 2.4 }) - 0.15, { kind: "slam" });
      MO.hide(tl, ["#s4-k", "#s4-t", "#s4-s"], D - 0.9, { kind: "blur" });
      MO.exit(tl, "#s4-scene", D, "blur", { overlap: true });
      window.__timelines["s4"] = tl;
    })();
  </script>
</template>
