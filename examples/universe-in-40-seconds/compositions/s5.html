<template>
  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080">
    <div class="mo-scene" id="s5-scene">
      <div class="mo-gl-host" id="s5-gl"></div>
      <div class="mo-stage" id="s5-stage">
        <div class="mo-safe" style="left:auto;right:96px;top:170px;width:700px">
          <div class="mo-kicker" id="s5-k">The Milky Way</div>
          <div class="mo-stat" id="s5-n" style="font-size:136px;margin-top:10px;line-height:1">100,000</div>
          <div class="mo-title" id="s5-u" style="font-size:64px">light-years across</div>
          <div class="mo-rule" id="s5-r" style="width:220px;margin:52px 0 40px"></div>
          <div class="mo-body mo-muted" id="s5-l">up to</div>
          <div class="mo-title mo-accent" id="s5-m" style="font-size:84px">400 billion stars</div>
        </div>
        <div id="s5-pin" class="u-pin"><span class="u-ring"></span><span class="u-dot"></span><span class="mo-kicker u-txt">You are here</span></div>
      </div>
      <div class="mo-grain"></div>
    </div>
  </div>
  <style>
    .u-pin { position: absolute; width: 48px; height: 48px; }
    .u-dot { position: absolute; left: 16px; top: 16px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 20px var(--accent); }
    .u-ring { position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--accent); }
    .u-txt { position: absolute; right: 60px; top: 6px; white-space: nowrap; font-size: 30px; }
  </style>
  <script>
    (function () {
      const D = 7;
      const tl = gsap.timeline({ paused: true });
      MO.enter(tl, "#s5-scene", 0, "blur");
      const st = MO3D.stage(tl, "#s5-gl", { D, cam: [0, 0, 20], fov: 40, bg: "--bg", bloom: 0.75, bloomThreshold: 0.6 });
      const T = st.T;
      MO3D.particles(st, "stars", { count: 2400, seed: 31 });
      const gal = MO3D.particles(st, "galaxy", { count: 52000, radius: 7.5, arms: 4, twist: 0.75, colors: ["#FFE9C4", "#7F8CFF"], seed: 7, size: 2.2 });
      const dust = MO3D.particles(st, "galaxy", { count: 9000, radius: 7.8, arms: 4, twist: 0.75, colors: ["#FF9E6B", "#C26BFF"], seed: 7, size: 3.2, opacity: 0.35 });
      const disc = new T.Group(); st.root.add(disc); disc.add(gal); disc.add(dust);
      disc.rotation.set(1.05, 0, 0.25);
      disc.position.set(-3.2, -0.3, 0);
      tl.fromTo([gal.rotation, dust.rotation], { y: 0 }, { y: -0.22, duration: D, ease: "none" }, 0);
      // "You are here": two thirds out, on an arm (Orion Arm), about 26,000 ly from the centre.
      const here = new T.Object3D(); gal.add(here); here.position.set(-4.4, 0, -1.9);
      MO3D.label(st, here, "#s5-pin", { dx: 0 });
      // Start close on the pin (the speck from s4), then pull back to the whole galaxy.
      disc.updateMatrixWorld(true);
      const P = here.getWorldPosition(new T.Vector3());
      st.camera.position.copy(P).add(new T.Vector3(0.2, 0.5, 1.6)); st.look.copy(P);
      MO3D.cam(tl, st, 0.4, { pos: [0.5, 4.5, 15], look: [-0.6, 0, 0], dur: 3.2, ease: "power3.inOut" });
      MO3D.cam(tl, st, 3.6, { pos: [1.6, 3.2, 14], look: [-0.4, 0, 0], dur: D - 3.6, ease: "none" });
      tl.fromTo("#s5-pin", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.3);
      tl.fromTo("#s5-pin .u-ring", { scale: 0.5, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out" }, 0.6);
      const tn = MO.atWord("s5", "hundred", { fallback: 1.6 });
      MO.reveal(tl, "#s5-k", tn - 0.6, { kind: "rise" });
      MO.reveal(tl, "#s5-n", tn - 0.1, { kind: "slam" });
      MO.count(tl, "#s5-n", 0, 100000, tn - 0.1, { dur: 1.3 });
      MO.reveal(tl, "#s5-u", tn + 0.3, { kind: "rise" });
      const tf = MO.atWord("s5", "four", { fallback: 4.4 });
      MO.reveal(tl, "#s5-r", tf - 0.5, { kind: "grow" });
      MO.reveal(tl, "#s5-l", tf - 0.4, { kind: "rise" });
      MO.reveal(tl, "#s5-m", tf - 0.05, { kind: "stamp" });
      MO.exit(tl, "#s5-scene", D, "deep", { overlap: true });
      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
