<template>
  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
    <div class="mo-scene" id="s2-scene">
      <div class="mo-gl-host" id="s2-gl"></div>
      <div class="mo-stage" id="s2-stage">
        <div class="mo-safe" style="top:640px">
          <div class="mo-kicker" id="s2-k">The Moon</div>
          <div class="mo-stat" id="s2-n" style="font-size:170px;margin-top:10px;white-space:nowrap">0</div>
          <div class="mo-body mo-muted" id="s2-l" style="margin-top:6px">Its light reaches you in <span class="mo-accent-2">1.3 s</span></div>
        </div>
        <div id="s2-pin" class="u-pin"><span class="u-dot"></span></div>
        <div id="s2-moon" class="mo-kicker u-tag">Moon</div>
      </div>
      <div class="mo-grain"></div>
    </div>
  </div>
  <style>
    .u-pin { position: absolute; width: 64px; height: 64px; }
    .u-dot { position: absolute; left: 22px; top: 22px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 24px var(--accent); }
    .u-tag { position: absolute; color: var(--text); opacity: 0.85; }
  </style>
  <script>
    (function () {
      const D = 5.5;
      const tl = gsap.timeline({ paused: true });
      // Same framing as the end of s1 (match cut), then the camera keeps pulling back.
      const st = MO3D.stage(tl, "#s2-gl", { D, cam: [0, 0.3, 5.6], look: [0.8, 0, 0], fov: 32, bg: "--bg", bloom: 0.3, key: "#FFF1DE", rim: "#6FB6FF" });
      const T = st.T;
      MO3D.particles(st, "stars", { count: 3200, seed: 5 });
      const earth = MO3D.planet(st, "earth", { size: 1, seed: 4 });
      earth.position.set(1.75, 0, 0);
      earth.rotation.z = 0.41;
      const surf = earth.userData.surface;
      tl.fromTo(surf.rotation, { y: -0.35 }, { y: -0.05, duration: D, ease: "none" }, 0);
      tl.fromTo(earth.userData.clouds.rotation, { y: 0.06 }, { y: 0.14, duration: D, ease: "none" }, 0);
      const moon = MO3D.planet(st, "moon", { size: 0.32, seed: 9, res: 512 });
      moon.position.set(-7.4, 2.4, -3);
      tl.fromTo(moon.rotation, { y: 0 }, { y: 0.4, duration: D, ease: "none" }, 0);
      MO3D.cam(tl, st, 0.15, { pos: [-2.2, 1.2, 15.5], look: [-2.9, 0.2, -1.2], dur: 3.4, ease: "power2.inOut" });
      // Pin carried over from s1.
      earth.updateMatrixWorld(true);
      const c = earth.position.clone();
      const dir = new T.Vector3(0, 0.25, 4.6).sub(c).normalize();
      dir.applyAxisAngle(new T.Vector3(0, 1, 0), -0.32); dir.y += 0.38; dir.normalize();
      surf.rotation.y = -0.6; surf.updateMatrixWorld(true); // the pin's spot as computed in s1
      const p = surf.worldToLocal(c.clone().add(dir));
      surf.rotation.y = -0.35;
      MO3D.label(st, surf, "#s2-pin", { offset: [p.x, p.y, p.z] });
      MO3D.label(st, moon, "#s2-moon", { offset: [0, -0.75, 0] });
      // Dotted line Earth -> Moon, drawn while the camera pulls back.
      const a = earth.position.clone(), b = moon.position.clone();
      // A trail of glowing dots, drawn from the Earth to the Moon.
      const N = 70, dots = [];
      for (let i = 1; i < N; i++) dots.push(a.clone().lerp(b, i / N));
      const geo = new T.BufferGeometry().setFromPoints(dots);
      const trail = new T.Points(geo, new T.PointsMaterial({ color: MO3D.col("--accent"), size: 0.07, transparent: true, depthWrite: false }));
      st.scene.add(trail);
      const prog = { p: 0 };
      tl.fromTo(prog, { p: 0 }, { p: 1, duration: 1.6, ease: "power2.inOut" }, 1.0);
      st.frame(() => { geo.setDrawRange(0, Math.round(prog.p * (N - 1))); });
      MO.cue(1.0, "swish", { gain: -6 });
      let t = MO.reveal(tl, "#s2-k", 0.5, { kind: "rise" });
      MO.reveal(tl, "#s2-n", 0.7, { kind: "rise" });
      MO.count(tl, "#s2-n", 0, 384400, MO.atWord("s2", "Three", { fallback: 1.2 }), { dur: 1.8, suffix: " km", suffixClass: "mo-title mo-accent" });
      MO.reveal(tl, "#s2-moon", 2.4, { kind: "fade" });
      MO.reveal(tl, "#s2-l", 2.5, { kind: "rise" });
      MO.exit(tl, "#s2-scene", D, "blur", { overlap: true });
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
